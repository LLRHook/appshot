name: CI

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned: ubuntu-latest moved to Ubuntu 26, which Playwright 1.59 does not officially support.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type and Svelte check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Build
        run: npm run build

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: Browser journeys and export continuity
        id: browser
        run: npm run test:e2e

      - name: Diagnose renderer crash mechanism after a browser failure
        if: failure() && steps.browser.outcome == 'failure'
        timeout-minutes: 4
        run: npx playwright test --config e2e/crash-probe.config.ts

      - name: Upload Playwright traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 14
